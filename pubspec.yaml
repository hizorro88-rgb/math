name: preschool_math
description: "미취학~초등 저학년 아동을 위한 수학·한글 학습 게임 (듀오링고 스타일)"
publish_to: "none"
# 버전 규칙: 스토어 제출마다 +빌드번호 증가, 기능 릴리스마다 가운데 숫자 증가
version: 1.9.3+17

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^18.0.1
  flutter_tts: ^4.2.0
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1

# 앱 아이콘 생성: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#58CC02"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# 스플래시 화면 생성: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#58CC02"
  image: "assets/splash/splash_owl.png"
  android_12:
    color: "#58CC02"
    image: "assets/splash/splash_owl.png"

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
